<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
  <!--Le Champs de saisie -->  
    <section class="shop panel">
      <h1>Ajouter un produit</h1>
      <div class="product-row">
        <input id="product-name" type="text" placeholder="Nom du produit" aria-label="Nom du produit" />
        <input id="product-price" type="number" placeholder="Prix (Fr Cfa)" min="0" step="0.01" aria-label="Prix" style="width:120px" />
        <button id="add-btn" class="btn primary">Ajouter</button>
      </div>

      <div class="items-list" id="items-list" aria-live="polite"></div>
    </section>
    <!--Le Panier -->
    <aside class="cart panel">
      <h2>Panier</h2>
      <ul id="cart-items"></ul>
      <div class="cart-footer">
        <div class="small" id="cart-total">Total: 0,00 FrCfass</div>
        <button id="checkout-btn" class="btn success" style="margin-top:.6rem">Valider la commande</button>
        <div id="msg" class="message" role="status" aria-live="assertive" style="display:none"></div>
      </div>
    </aside>
  </main>


  <script src="main.js" defer></script>
</body>
</html>
